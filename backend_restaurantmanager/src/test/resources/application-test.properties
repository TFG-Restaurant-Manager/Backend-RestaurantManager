# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Map Java enums to VARCHAR (avoids PostgreSQL native enum type incompatibility in H2)
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12

# JWT secret for tests (minimum 32 bytes for HS256)
jwt.secret=test-secret-key-must-be-at-least-32-chars!!

# Suppress noisy logs during tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
